<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exit_ProtocoL Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Pixelify+Sans:wght@500;700&family=Share+Tech+Mono&family=VT323&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="topbar" id="topbar">
    <span class="who"><span class="dotlive"></span><span id="whoName">guest</span></span>
    <span class="where" id="where"></span>
    <span class="row"><button class="btn soft sm" id="facBtn" aria-pressed="false">Host script</button></span>
  </header>
  <div class="banner" id="banner" hidden><span class="t" id="bannerT">Intermission</span><span class="tm" id="tmr">0:00</span></div>
  <section class="hud" id="hud" aria-label="My attributes" hidden></section>
  <ol class="steps" id="steps" aria-label="Progress"></ol>
  <aside class="fac" id="fac" hidden></aside>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>
<div class="whisper" id="whisper" role="status" hidden></div>
<nav class="nav" aria-label="Back and forward"><div class="in">
  <button class="btn blue" id="navBack">◀ Back</button>
  <span class="mid" id="navMid"></span>
  <button class="btn red" id="navNext">Next ▶</button>
</div></nav>
<script src="game.js"></script>
</body>
</html>
